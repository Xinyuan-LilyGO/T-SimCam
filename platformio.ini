[platformio]
default_envs = v1_3
; default_envs = v1_4
src_dir = examples/ATDebug
; src_dir = examples/Factory
; src_dir = examples/MinimalAuxSerialExample
; src_dir = examples/MinimalButtonExample
; src_dir = examples/CameraWebServerExample
; src_dir = examples/MinimalIRCutExample
; src_dir = examples/MinimalMicrophoneExample
; src_dir = examples/MinimalSDCardExample
; src_dir = examples/MinimalWirelessExample

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32s3box
board_build.partitions = app3M_fat9M_16MB.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_filters = esp32_exception_decoder

[env:v1_3]
build_flags =
    ${env.build_flags}
    -DT_SIMCAM_BOARD_VERSION=13

[env:v1_4]
build_flags =
    ${env.build_flags}
    -DT_SIMCAM_BOARD_VERSION=14
